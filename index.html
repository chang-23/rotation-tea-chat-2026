<aside class="notes" id="notes" hidden=""><button id="closeNotes" aria-label="关闭主持人提示">×</button><h3>主持人提示</h3><p id="noteText" spellcheck="false">共 20 分钟，每位新人约 4 分钟。

可追问：“为了更好地理解项目管理，你还想补上哪段经历？”

对应导师可以简短澄清需求。记录期待、支持动作、跟进人、反馈时间。涉及资源的安排确认后反馈，不必现场承诺。</p></aside><div class="toast" id="toast" role="status" hidden="">计时已更新；正文中的时间说明可点击修改。</div>
<script type="application/json" id="savedContent">{"pages":{"0":{"html":"\u003csection class=\"screen hero\">\u003cdiv>\u003cdiv class=\"eyebrow\">两个月，一段新的经历\u003c/div>\u003ch1>轮岗进行时\u003cbr>\u003cem>有话慢慢聊。\u003c/em>\u003c/h1>\u003cp class=\"intro\">轻松交流，互相帮助。\u003cbr>聊聊你的发现，也聊聊还在摸索的事。\u003c/p>\u003cp class=\"quiet\">先了解成长课题与学习安排，再聊聊轮岗体验。\u003c/p>\u003c/div>\u003cdiv class=\"hero-right\">\u003cdiv class=\"route\">\u003cspan class=\"num\">01\u003c/span>\u003cdiv>\u003cstrong>管培生年度成长课题\u003c/strong>\u003csmall>主讲人：冯洋\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"route\">\u003cspan class=\"num\">02\u003c/span>\u003cdiv>\u003cstrong>学习资料脉络及学习计划\u003c/strong>\u003csmall>主讲人：贺雨欣\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"route\">\u003cspan class=\"num\">03\u003c/span>\u003cdiv>\u003cstrong>轮岗茶话会交流\u003c/strong>\u003csmall>聊收获 · 说困惑 · 谈期待\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/section>","note":"开场介绍今天的安排。先由冯洋介绍管培生年度成长课题，再由贺雨欣介绍组内学习资料脉络及学习计划，随后进入轮岗茶话会。\n两个新增环节暂各按 10 分钟计时，全部环节合计 115 分钟，可在编辑模式调整。\n三轮交流仍以新人分享为主，导师自然接话，不逐人点评。","name":"开场","minutes":10},"1":{"name":"成长课题","minutes":10,"note":"正式交流前的第 一 个介绍环节。主讲人：冯洋。\n暂按 10 分钟设置计时，可在编辑模式调整。\n请主讲人结合实际资料介绍，页面仅展示主题与主讲人。","html":"\u003csection class=\"screen speaker-page\">\u003cdiv class=\"eyebrow\">正式交流前 / 第 一 个环节\u003c/div>\u003ch2>管培生\u003cbr>年度成长课题\u003c/h2>\u003cdiv class=\"speaker-line\">\u003cspan class=\"lead\">主讲人\u003c/span>\u003cp class=\"intro\">冯洋\u003c/p>\u003c/div>\u003c/section>"},"2":{"name":"学习计划","minutes":10,"note":"正式交流前的第 二 个介绍环节。主讲人：贺雨欣。\n暂按 10 分钟设置计时，可在编辑模式调整。\n请主讲人结合实际资料介绍，页面仅展示主题与主讲人。","html":"\u003csection class=\"screen speaker-page\">\u003cdiv class=\"eyebrow\">正式交流前 / 第 二 个环节\u003c/div>\u003ch2>组内学习资料脉络\u003cbr>及学习计划\u003c/h2>\u003cdiv class=\"speaker-line\">\u003cspan class=\"lead\">主讲人\u003c/span>\u003cp class=\"intro\">贺雨欣\u003c/p>\u003c/div>\u003c/section>"},"3":{"html":"\u003csection class=\"screen round\">\u003cdiv>\u003cdiv class=\"eyebrow\">第一轮 / 聊收获\u003c/div>\u003ch2>这段经历，\u003cbr>我有了新发现。\u003c/h2>\u003cp class=\"lead\">从一件具体的小事说起。\u003cbr>任选 2—3 个问题，聊聊你的真实体会。\u003c/p>\u003cdiv class=\"duration\">\u003cb>20\u003c/b>\u003cspan>分钟，慢慢聊\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"questions\">\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">01\u003c/span>\u003cdiv>\u003ch3>简单介绍\u003c/h3>\u003cp>这段时间主要在哪个部门，接触了哪些工作？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">02\u003c/span>\u003cdiv>\u003ch3>一次经历\u003c/h3>\u003cp>哪件事让你对轮岗部门的工作，有了新的认识？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">03\u003c/span>\u003cdiv>\u003ch3>一种方法\u003c/h3>\u003cp>学到的哪种方法或者做事方式，以后做项目管理也用得上？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">04\u003c/span>\u003cdiv>\u003ch3>一个新视角\u003c/h3>\u003cp>站在轮岗部门的角度，有什么建议能提？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"prompt\">\u003cbr>\u003c/div>\u003c/div>\u003c/section>","note":"共 20 分钟，每位新人约 4 分钟。先简要介绍所在部门与接触的工作，再讲具体经历。\n\n可以追问：当时发生了什么？你参与了哪一步？现在的理解有什么不同？\n\n优先邀请其他新人接话：“你们有没有类似的发现？”避免固定请对应导师点评。","name":"聊收获","minutes":20},"4":{"html":"\u003csection class=\"screen break\">\u003cdiv class=\"eyebrow\">\u003cbr>\u003c/div>\u003ch2>简单聊聊，\u003cbr>把困惑慢慢说出来。\u003c/h2>\u003cp class=\"intro\">轮岗过程中，有没有一件事，\u003cbr>你一直想找人聊聊，却还没找到合适的机会？\u003c/p>\u003cdiv class=\"break-steps\">\u003cspan>写下一个问题\u003c/span>\u003cspan>可以不署名\u003c/span>\u003cspan>一起选 2—3 个话题\u003c/span>\u003c/div>\u003cp class=\"quiet\">不方便展开的细节，可以保留。\u003c/p>\u003c/section>","note":"共 10 分钟。请新人各写一个困惑，可以不署名，也可以用会前征集的问题。\n\n将相近问题归类，请新人选出 2—3 个最想聊的话题。具体经历可能被辨认，不追问人名，允许保留细节。","name":"茶歇","minutes":10},"5":{"html":"\u003csection class=\"screen round\">\u003cdiv>\u003cdiv class=\"eyebrow\">第二轮 / 说困惑\u003c/div>\u003ch2>这些地方，\u003cbr>我还在摸索。\u003c/h2>\u003cp class=\"lead\">从刚才选中的话题聊起。\u003cbr>目前最让你拿不准的，是什么？\u003c/p>\u003cdiv class=\"duration\">\u003cb>30\u003c/b>\u003cspan>分钟，慢慢聊\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"questions\">\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">01\u003c/span>\u003cdiv>\u003ch3>学什么，学多深\u003c/h3>\u003cp>清楚自己应该重点学什么、学到什么程度吗？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">02\u003c/span>\u003cdiv>\u003ch3>做过了，学到了吗\u003c/h3>\u003cp>参与了不少事情，怎样判断自己的收获？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">03\u003c/span>\u003cdiv>\u003ch3>不熟悉，怎么入手\u003c/h3>\u003cp>遇到陌生的技术或业务，通常怎么学，哪里容易卡住？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">04\u003c/span>\u003cdiv>\u003ch3>轮岗与 PM 的联系\u003c/h3>\u003cp>这些经历与未来的项目管理工作，还有哪些联系没想清楚？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"prompt\">\u003cbr>\u003c/div>\u003c/div>\u003c/section>","note":"共 30 分钟，讨论选出的 2—3 个话题，每题约 10 分钟。右侧问题仅作备用，不逐题点名回答。\n\n围绕：发生了什么、卡在哪一步、已经试过什么、需要怎样的帮助。\n\n新人先说，同伴补充，导师按需回应。可以问：“更希望一起理清思路，还是协调具体支持？”不必当场解决所有问题。","name":"说困惑","minutes":30},"6":{"html":"\u003csection class=\"screen round\">\u003cdiv>\u003cdiv class=\"eyebrow\">第三轮 / 谈期待\u003c/div>\u003ch2>接下来轮岗，\u003cbr>我希望……\u003c/h2>\u003cp class=\"lead\">选一个最想实现的期待。\u003cbr>聊具体一点，才能更清楚地知道怎样支持你。\u003c/p>\u003cdiv class=\"duration\">\u003cb>20\u003c/b>\u003cspan>分钟，慢慢聊\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"questions\">\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">01\u003c/span>\u003cdiv>\u003ch3>进一步了解\u003c/h3>\u003cp>最想深入了解哪个业务环节？为什么？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">02\u003c/span>\u003cdiv>\u003ch3>亲自试一试\u003c/h3>\u003cp>希望参与或独立尝试哪一项具体工作？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">03\u003c/span>\u003cdiv>\u003ch3>有人搭把手\u003c/h3>\u003cp>希望成长导师或轮岗部门提供什么帮助？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">04\u003c/span>\u003cdiv>\u003ch3>看见自己的成长\u003c/h3>\u003cp>下一阶段结束时，希望自己在哪方面更进一步？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"prompt\">\u003cbr>\u003c/div>\u003c/div>\u003c/section>","note":"共 20 分钟，每位新人约 4 分钟。\n\n可追问：“为了更好地理解项目管理，你还想补上哪段经历？”\n\n对应导师可以简短澄清需求。记录期待、支持动作、跟进人、反馈时间。涉及资源的安排确认后反馈，不必现场承诺。","name":"谈期待","minutes":20},"7":{"html":"\u003csection class=\"screen closing\">\u003cdiv class=\"eyebrow\">\u003cbr>\u003c/div>\u003ch2>今天，\u003cbr>我带走的一个收获是\u003cspan>……\u003c/span>\u003c/h2>\u003cp class=\"intro\">也把一个期待留下来，我们一起想办法。\u003c/p>\u003cdiv class=\"support\">\u003cdiv>我想尝试什么\u003csmall>一项具体实践\u003cbr>或一个想深入了解的环节\u003c/small>\u003c/div>\u003cdiv>希望得到什么支持\u003csmall>一次机会、一份资料\u003cbr>或一次有针对性的交流\u003c/small>\u003c/div>\u003cdiv>由谁、何时反馈\u003csmall>确定跟进人与反馈时间\u003cbr>有进展，再一起聊聊\u003c/small>\u003c/div>\u003c/div>\u003c/section>","note":"共 5 分钟，每位新人用一句话分享收获。主持人简要归纳需要跟进的支持事项，明确由谁、何时反馈。\n\n会后只整理共性主题和支持事项，不记录个人表现。如有余裕，再留 10 分钟自由交流。","name":"收尾","minutes":5}},"header":"\u003cdiv class=\"brand\">\u003ci>\u003c/i>\u003cspan>轮岗进行时\u003c/span>\u003c/div>\u003cspan class=\"edition\">入职两个月 · 管培生茶话会\u003c/span>","revision":"20260921-pre-talk-v1"}</script>

小事说起。\u003cbr>任选 2—3 个问题，聊聊你的真实体会。\u003c/p>\u003cdiv class=\"duration\">\u003cb>20\u003c/b>\u003cspan>分钟，慢慢聊\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"questions\">\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">01\u003c/span>\u003cdiv>\u003ch3>简单介绍\u003c/h3>\u003cp>这段时间主要在哪个部门，接触了哪些工作？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">02\u003c/span>\u003cdiv>\u003ch3>一次经历\u003c/h3>\u003cp>哪件事让你对轮岗部门的工作，有了新的认识？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">03\u003c/span>\u003cdiv>\u003ch3>一种方法\u003c/h3>\u003cp>学到的哪种方法或者做事方式，以后做项目管理也用得上？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">04\u003c/span>\u003cdiv>\u003ch3>一个新视角\u003c/h3>\u003cp>站在轮岗部门的角度，有什么建议能提？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"prompt\">\u003cbr>\u003c/div>\u003c/div>\u003c/section>","note":"共 20 分钟，每位新人约 4 分钟。先简要介绍所在部门与接触的工作，再讲具体经历。\n\n可以追问：当时发生了什么？你参与了哪一步？现在的理解有什么不同？\n\n优先邀请其他新人接话：“你们有没有类似的发现？”避免固定请对应导师点评。","name":"聊收获","minutes":20},{"html":"\u003csection class=\"screen break\">\u003cdiv class=\"eyebrow\">\u003cbr>\u003c/div>\u003ch2>简单聊聊，\u003cbr>把困惑慢慢说出来。\u003c/h2>\u003cp class=\"intro\">轮岗过程中，有没有一件事，\u003cbr>你一直想找人聊聊，却还没找到合适的机会？\u003c/p>\u003cdiv class=\"break-steps\">\u003cspan>写下一个问题\u003c/span>\u003cspan>可以不署名\u003c/span>\u003cspan>一起选 2—3 个话题\u003c/span>\u003c/div>\u003cp class=\"quiet\">不方便展开的细节，可以保留。\u003c/p>\u003c/section>","note":"共 10 分钟。请新人各写一个困惑，可以不署名，也可以用会前征集的问题。\n\n将相近问题归类，请新人选出 2—3 个最想聊的话题。具体经历可能被辨认，不追问人名，允许保留细节。","name":"茶歇","minutes":10},{"html":"\u003csection class=\"screen round\">\u003cdiv>\u003cdiv class=\"eyebrow\">第二轮 / 说困惑\u003c/div>\u003ch2>这些地方，\u003cbr>我还在摸索。\u003c/h2>\u003cp class=\"lead\">从刚才选中的话题聊起。\u003cbr>目前最让你拿不准的，是什么？\u003c/p>\u003cdiv class=\"duration\">\u003cb>30\u003c/b>\u003cspan>分钟，慢慢聊\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"questions\">\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">01\u003c/span>\u003cdiv>\u003ch3>学什么，学多深\u003c/h3>\u003cp>清楚自己应该重点学什么、学到什么程度吗？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">02\u003c/span>\u003cdiv>\u003ch3>做过了，学到了吗\u003c/h3>\u003cp>参与了不少事情，怎样判断自己的收获？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">03\u003c/span>\u003cdiv>\u003ch3>不熟悉，怎么入手\u003c/h3>\u003cp>遇到陌生的技术或业务，通常怎么学，哪里容易卡住？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">04\u003c/span>\u003cdiv>\u003ch3>轮岗与 PM 的联系\u003c/h3>\u003cp>这些经历与未来的项目管理工作，还有哪些联系没想清楚？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"prompt\">\u003cbr>\u003c/div>\u003c/div>\u003c/section>","note":"共 30 分钟，讨论选出的 2—3 个话题，每题约 10 分钟。右侧问题仅作备用，不逐题点名回答。\n\n围绕：发生了什么、卡在哪一步、已经试过什么、需要怎样的帮助。\n\n新人先说，同伴补充，导师按需回应。可以问：“更希望一起理清思路，还是协调具体支持？”不必当场解决所有问题。","name":"说困惑","minutes":30},{"html":"\u003csection class=\"screen round\">\u003cdiv>\u003cdiv class=\"eyebrow\">第三轮 / 谈期待\u003c/div>\u003ch2>接下来轮岗，\u003cbr>我希望……\u003c/h2>\u003cp class=\"lead\">选一个最想实现的期待。\u003cbr>聊具体一点，才能更清楚地知道怎样支持你。\u003c/p>\u003cdiv class=\"duration\">\u003cb>20\u003c/b>\u003cspan>分钟，慢慢聊\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"questions\">\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">01\u003c/span>\u003cdiv>\u003ch3>进一步了解\u003c/h3>\u003cp>最想深入了解哪个业务环节？为什么？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">02\u003c/span>\u003cdiv>\u003ch3>亲自试一试\u003c/h3>\u003cp>希望参与或独立尝试哪一项具体工作？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">03\u003c/span>\u003cdiv>\u003ch3>有人搭把手\u003c/h3>\u003cp>希望成长导师或轮岗部门提供什么帮助？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"question\" tabindex=\"0\" role=\"button\" aria-pressed=\"false\">\u003cspan class=\"num\">04\u003c/span>\u003cdiv>\u003ch3>看见自己的成长\u003c/h3>\u003cp>下一阶段结束时，希望自己在哪方面更进一步？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"prompt\">\u003cbr>\u003c/div>\u003c/div>\u003c/section>","note":"共 20 分钟，每位新人约 4 分钟。\n\n可追问：“为了更好地理解项目管理，你还想补上哪段经历？”\n\n对应导师可以简短澄清需求。记录期待、支持动作、跟进人、反馈时间。涉及资源的安排确认后反馈，不必现场承诺。","name":"谈期待","minutes":20},{"html":"\u003csection class=\"screen closing\">\u003cdiv class=\"eyebrow\">\u003cbr>\u003c/div>\u003ch2>今天，\u003cbr>我带走的一个收获是\u003cspan>……\u003c/span>\u003c/h2>\u003cp class=\"intro\">也把一个期待留下来，我们一起想办法。\u003c/p>\u003cdiv class=\"support\">\u003cdiv>我想尝试什么\u003csmall>一项具体实践\u003cbr>或一个想深入了解的环节\u003c/small>\u003c/div>\u003cdiv>希望得到什么支持\u003csmall>一次机会、一份资料\u003cbr>或一次有针对性的交流\u003c/small>\u003c/div>\u003cdiv>由谁、何时反馈\u003csmall>确定跟进人与反馈时间\u003cbr>有进展，再一起聊聊\u003c/small>\u003c/div>\u003c/div>\u003c/section>","note":"共 5 分钟，每位新人用一句话分享收获。主持人简要归纳需要跟进的支持事项，明确由谁、何时反馈。\n\n会后只整理共性主题和支持事项，不记录个人表现。如有余裕，再留 10 分钟自由交流。","name":"收尾","minutes":5}];
let index=0,remaining=600,deadline=0,running=false,tick=null;
const $=id=>document.getElementById(id);
function render(){const r=rounds[index];$('stage').innerHTML=r.html||`<section class="screen round"><div><div class="eyebrow">${r.kicker}</div><h2>${r.title}</h2><p class="lead">${r.lead}</p><div class="duration"><b>${r.minutes}</b><span>分钟，慢慢聊</span></div></div><div class="questions">${r.qs.map((q,i)=>`<div class="question" tabindex="0" role="button" aria-pressed="false"><span class="num">0${i+1}</span><div><h3>${q[0]}</h3><p>${q[1]}</p></div></div>`).join('')}<div class="prompt">${r.hint}</div></div></section>`;$('nav').innerHTML=rounds.map((r,i)=>`<button class="dot ${i===index?'current':''}" data-i="${i}" ${i===index?'aria-current="step"':''}>${r.name}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));document.querySelectorAll('.question').forEach(q=>{const select=()=>{if(editing)return;const active=q.classList.toggle('active');q.setAttribute('aria-pressed',active)};q.onclick=select;q.onkeydown=e=>{if(editing)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}}});$('noteText').textContent=r.note;$('prev').disabled=index===0;$('next').disabled=index===rounds.length-1;$('progress').style.width=((index+1)/rounds.length*100)+'%';updateClock()}
function stop(){running=false;clearInterval(tick);tick=null;$('playBtn').textContent='开始'}
function go(i){capturePage();if(i<0||i>=rounds.length||i===index)return;stop();index=i;remaining=rounds[index].minutes*60;showNotes(false);render();window.scrollTo({top:0,behavior:'smooth'})}
function updateClock(){$('timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('timer').style.color=remaining===0?'var(--accent)':'var(--ink)'}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,4000)}
function run(){if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();updateClock();return}if(remaining<=0)remaining=rounds[index].minutes*60;deadline=Date.now()+remaining*1000;running=true;$('playBtn').textContent='暂停';tick=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));updateClock();if(!remaining){stop();toast('本环节时间到，可继续交流或进入下一环节。')}},250);updateClock()}
function showNotes(show){$('notes').hidden=!show;$('noteBtn').setAttribute('aria-expanded',show)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('当前浏览器不支持全屏，可尝试按 F11。')}catch(e){toast('无法进入全屏，可尝试浏览器的 F11 键。')}}
$('playBtn').onclick=run;$('resetBtn').onclick=()=>{stop();remaining=rounds[index].minutes*60;updateClock()};$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('noteBtn').onclick=()=>showNotes($('notes').hidden);$('closeNotes').onclick=()=>showNotes(false);$('fullBtn').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'});document.addEventListener('keydown',e=>{if(e.target.isContentEditable||e.target.closest('[contenteditable=true]')||e.target.matches('button,input,textarea,[role="button"]'))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='Escape')showNotes(false)});
let editing=false,dirty=false;
const originalRender=render;
let content=JSON.parse($('savedContent').textContent);
const storageKey='rotation-tea-editor-v1:'+location.pathname+':'+content.revision;
try{const draft=localStorage.getItem(storageKey);if(draft)content=JSON.parse(draft)}catch(e){}
function escapeText(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function cleanHTML(el){const copy=el.cloneNode(true);copy.querySelectorAll('[contenteditable]').forEach(n=>{n.removeAttribute('contenteditable');n.removeAttribute('spellcheck')});copy.querySelectorAll('.question').forEach(q=>{q.classList.remove('active');q.setAttribute('aria-pressed','false')});return copy.innerHTML}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(content));$('saveStatus').textContent='已暂存到当前浏览器 · 请下载 HTML 留存'}catch(e){$('saveStatus').textContent='浏览器暂存不可用 · 请下载 HTML 留存'}}
function capturePage(){if(!$('stage').firstElementChild)return;content.pages[index]={html:cleanHTML($('stage')),note:$('noteText').innerText,name:rounds[index].name,minutes:rounds[index].minutes};content.header=cleanHTML(document.querySelector('header'));if(editing)persist()}
function enableFields(){const selectors='.eyebrow,h1,h2,.intro,.quiet,.route .num,.route strong,.route small,.route time,.lead,.duration span,.question .num,.question h3,.question p,.prompt,.break-steps span,.support>div';const nodes=[...$('stage').querySelectorAll(selectors),...document.querySelectorAll('header .brand span,header .edition'),$('noteText')];nodes.forEach(el=>{el.contentEditable=editing?'true':'false';el.spellcheck=false;el.oninput=()=>{dirty=true;capturePage()};el.onpaste=e=>{if(!editing)return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});$('pageName').value=rounds[index].name;$('pageMinutes').value=rounds[index].minutes}
render=function(){const saved=content.pages[index];if(saved){rounds[index].html=saved.html;rounds[index].note=saved.note;rounds[index].name=saved.name;rounds[index].minutes=saved.minutes}originalRender();enableFields()};
function initializeEditor(){Object.entries(content.pages).forEach(([i,v])=>{if(rounds[i])Object.assign(rounds[i],{html:v.html,note:v.note,name:v.name,minutes:v.minutes})});if(content.header)document.querySelector('header').innerHTML=content.header;remaining=rounds[0].minutes*60;render();$('editBtn').onclick=()=>{capturePage();editing=!editing;stop();document.body.classList.toggle('editing',editing);$('editorbar').hidden=!editing;$('editBtn').textContent=editing?'完成编辑':'编辑内容';enableFields();if(editing)toast('点击文字直接修改；主持人提示也可编辑。')};$('pageName').onchange=()=>{rounds[index].name=$('pageName').value.trim()||rounds[index].name;capturePage();dirty=true;render()};$('pageMinutes').onchange=()=>{const v=Number($('pageMinutes').value);if(!Number.isInteger(v)||v<1||v>180){$('pageMinutes').value=rounds[index].minutes;toast('请输入 1—180 的整数分钟');return}rounds[index].minutes=v;stop();remaining=v*60;const b=$('stage').querySelector('.duration b');if(b)b.textContent=v;capturePage();dirty=true;updateClock();toast('计时已更新；正文中的时间说明可点击修改。')};$('saveBtn').onclick=downloadHTML;}
function downloadHTML(){capturePage();const doc=document.documentElement.cloneNode(true);const exportContent=JSON.parse(JSON.stringify(content));exportContent.revision=Date.now().toString();doc.querySelector('#savedContent').textContent=JSON.stringify(exportContent).replaceAll('<','\\u003c').replaceAll('>','\\u003e');doc.querySelector('#stage').innerHTML='';doc.querySelector('#nav').innerHTML='';doc.querySelector('#notes').hidden=true;doc.querySelector('#toast').hidden=true;doc.querySelector('#editorbar').hidden=true;doc.querySelector('body').classList.remove('editing');doc.querySelector('#editBtn').textContent='编辑内容';doc.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));const blob=new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='轮岗茶话会_已编辑.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);dirty=false;toast('已生成下载文件，修改内容已包含在 HTML 中。')}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

initializeEditor();
</script>
</body></html>
